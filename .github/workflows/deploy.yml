name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts: dependencies never get to run install scripts in CI
      - run: npm ci --ignore-scripts

      - run: npx ng build --base-href /movie-website/

      # GitHub Pages has no SPA fallback: serve the app for unknown paths too,
      # so deep links such as /details/123 survive a refresh.
      - run: cp dist/movie-website/browser/index.html dist/movie-website/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/movie-website/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
